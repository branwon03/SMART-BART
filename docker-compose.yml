services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "CSE_312!"
      POSTGRES_DB: bart_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    # Host .env often uses localhost/127.0.0.1; inside this container Postgres is the `db` service.
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:CSE_312!@db:5432/bart_db
    volumes:
      - ./src:/app/src
      - uploads:/app/uploads
      - ./.env:/app/.env
      - ./credentials.json:/app/credentials.json
    
    depends_on:
      db:
        condition: service_healthy

  processor:
    build: .
    restart: unless-stopped
    command: python -m src.backend.processor
    env_file: .env
    environment:
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: src/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
