services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    # Host .env often uses localhost; DATABASE_USE_INTERNAL_DB swaps host to Compose service `db`.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USE_INTERNAL_DB: "true"
    volumes:
      - ./src:/app/src
      - uploads:/app/uploads
      - ./.env:/app/.env
      - ./credentials.json:/app/credentials.json
    
    depends_on:
      db:
        condition: service_healthy

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: bart-mobile-tunnel
    # Same Compose network as frontend; port must match frontend (3000), not 3001.
    command: tunnel --url http://frontend:3000
    restart: unless-stopped
    depends_on:
      - frontend

  frontend:
    build:
      context: src/frontend
      args:
        # Empty = browser uses same-origin /api/* (rewrites to backend). Required for Cloudflare tunnel / mobile.
        NEXT_PUBLIC_API_BASE_URL: ""
        # Baked into next.config rewrites at build time; runtime env alone is not enough in standalone image.
        BACKEND_PROXY_URL: "http://backend:8000"
    environment:
      BACKEND_PROXY_URL: "http://backend:8000"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend: 
        condition: service_healthy

  gmail-worker:
    build: .
    command: python -m src.backend.check_email
    env_file: .env
    environment:
      - API_BASE_URL=http://backend:8000/api
    volumes:
      - ./config:/app/config
    depends_on:
      backend:
        condition: service_healthy
    

volumes:
  pgdata:
  uploads:
