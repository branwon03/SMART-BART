services:
  # Profiles: tunnel (Cloudflare expose), workers (processor + gmail-worker), mobile (Expo stack + tunnel).
  # Default: db + backend + frontend.
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # IANA name must use underscore; "America/LosAngeles" breaks TZ parsing → weird log abbreviations.
      TZ: America/Los_Angeles
    command: >
      postgres
      -c timezone=America/Los_Angeles
      -c log_timezone=America/Los_Angeles
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    # Host .env often uses localhost/127.0.0.1; inside this container Postgres is the `db` service.
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - uploads:/app/uploads
      - ./.env:/app/.env
      - ./credentials.json:/app/credentials.json
    
    depends_on:
      db:
        condition: service_healthy

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: bart-mobile-tunnel
    # Same Compose network as frontend; port must match frontend (3000), not 3001.
    command: tunnel --url http://frontend:3000
    restart: unless-stopped
    profiles: ["tunnel", "mobile"]
    depends_on:
      - frontend

  processor:
    build: . 
    restart: unless-stopped
    profiles: ["workers"]
    command: python -m src.backend.processor
    env_file: .env
    # Same as backend: .env often uses localhost; inside Compose Postgres is the `db` service.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_DIR: /app/uploads
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: "project-51a9be3f-d2d4-42cc-b2d"
    volumes:
      - uploads:/app/uploads
      - ./credentials.json:/app/credentials.json
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: src/frontend
      args:
        # Empty = browser uses same-origin /api/* (rewrites to backend). Required for Cloudflare tunnel / mobile.
        NEXT_PUBLIC_API_BASE_URL: ""
        # Baked into next.config rewrites at build time; runtime env alone is not enough in standalone image.
        BACKEND_PROXY_URL: "http://backend:8000"
    environment:
      BACKEND_PROXY_URL: "http://backend:8000"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend: 
        condition: service_healthy

  gmail-worker:
    build: .
    profiles: ["workers"]
    command: python -m src.backend.check_email
    env_file: .env
    environment:
      - API_BASE_URL=http://backend:8000/api
    volumes:
      - ./config:/app/config
    depends_on:
      backend:
        condition: service_healthy
    
  mobile:
    build:
      context: .
      dockerfile: Dockerfile.mobile
    restart: unless-stopped
    profiles: ["mobile"]
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ~/.expo:/root/.expo
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend
      - cloudflare-tunnel

volumes:
  pgdata:
  uploads:
