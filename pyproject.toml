[project]
name = "BART_Image_Classifier"
version = "0.10.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.135.1",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2.0",
    "psycopg2-binary>=2.9.11",
    "google-genai>=1.69.0",
    "google-auth>=2.49.1",
    "pgvector>=0.4.2",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  # Ignore deprecations from vbuild using pkgutil.find_loader (pending upstream fix)
  "ignore:'pkgutil.find_loader' is deprecated:DeprecationWarning:vbuild"
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
allow_zero_version = true
major_on_zero = false
upload_to_pypi = false
upload_to_release = true
commit_version_number = true
tag_commit = true
changelog_file = "CHANGELOG.md"
build_command = "python -m pip install uv && python -m uv build"

[tool.fastapi]
entrypoint = "src.backend.main:app"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.15.5",
    "types-requests>=2.32.0",
]
